<!DOCTYPE html>
<html>
    <head>
        <script>
            function getParams() {
                var params = new URLSearchParams(window.location.search);

                var title = params.get('title');
                var message = params.get('message');
                var details = params.get('details');
                var link = params.get('link')
                var linkText = params.get('linkText')

                if (title != null) {
                    document.getElementById('title').innerText = "SAML 2.0 - " + title;
                }

                if (message != null) {
                    document.getElementById('message').innerText = message;
                }

                if (details != null) {
                    document.getElementById('detailsTitle').innerText = "Details"
                    document.getElementById('detailsText').innerText = details
                } else {
                    document.getElementById('detailsTitle').innerText = ""
                    document.getElementById('detailsText').innerText = ""
                }

                if (link != null) {
                    document.getElementById('link').setAttribute("href", link)
                } else {
                    document.getElementById('link').setAttribute("href", "https://eliona.io")
                }

                if (linkText != null) {
                    document.getElementById('link').innerText = linkText
                } else {
                    document.getElementById('link').innerText = "eliona"
                }
            }
        </script>

        </style>
